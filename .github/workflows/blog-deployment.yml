name: Deploy Blog Post to GitHub

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL of the HTML file to deploy (from Google Drive or web)'
        required: true
        type: string
      post_title:
        description: 'Title of the blog post'
        required: true
        type: string
      file_name:
        description: 'File name (e.g., government-cleaning-contracts.html)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Blog Directory
        run: mkdir -p blog-posts

      - name: Download File
        run: |
          curl -L "${{ github.event.inputs.file_url }}" -o "blog-posts/${{ github.event.inputs.file_name }}"
          ls -lh "blog-posts/${{ github.event.inputs.file_name }}"

      - name: Configure Git
        run: |
          git config --local user.email "automation@abrightrose.com"
          git config --local user.name "ABR Content Bot"
          git config --local user.name

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet "blog-posts/${{ github.event.inputs.file_name }}"; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.changes.outputs.has_changes == 'true' || !contains(github.event.inputs.file_name, 'exists')
        run: |
          git add "blog-posts/${{ github.event.inputs.file_name }}"
          git commit -m "Add blog post: ${{ github.event.inputs.post_title }}" \
            --author="ABR Content Bot <automation@abrightrose.com>" \
            || echo "No changes to commit"
          git push origin main --force-with-lease

      - name: Post Deployment Summary
        run: |
          echo "✅ Blog Post Deployed Successfully!"
          echo "📄 File: ${{ github.event.inputs.file_name }}"
          echo "📝 Title: ${{ github.event.inputs.post_title }}"
          echo "🌐 View: https://github.com/${{ github.repository }}/blob/main/blog-posts/${{ github.event.inputs.file_name }}"
          echo ""
          echo "📝 Commit Info:"
          git log -1 --oneline
