name: Deploy Blog Post to GitHub

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL of the HTML file to deploy (from Google Drive or web)'
        required: true
        type: string
      post_title:
        description: 'Title of the blog post'
        required: true
        type: string
      file_name:
        description: 'File name (e.g., government-cleaning-contracts.html)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Create Blog Directory
        run: mkdir -p blog-posts

      - name: Download File
        run: |
          curl -L "${{ github.event.inputs.file_url }}" -o "blog-posts/${{ github.event.inputs.file_name }}"
          ls -lh "blog-posts/${{ github.event.inputs.file_name }}"

      - name: Configure Git
        run: |
          git config --local user.email "automation@abrightrose.com"
          git config --local user.name "ABR Content Bot"

      - name: Commit and Push
        run: |
          git add "blog-posts/${{ github.event.inputs.file_name }}"
          git commit -m "Add blog post: ${{ github.event.inputs.post_title }}" || echo "No changes to commit"
          git push origin main

      - name: Post Deployment Summary
        run: |
          echo "✅ Blog Post Deployed Successfully!"
          echo "📄 File: ${{ github.event.inputs.file_name }}"
          echo "📝 Title: ${{ github.event.inputs.post_title }}"
          echo "🌐 View: https://github.com/${{ github.repository }}/blob/main/blog-posts/${{ github.event.inputs.file_name }}"
